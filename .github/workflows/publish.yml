name: publish

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Build
        run: |
          cd packages/opencode
          bun run script/build.ts --skip-install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: |
            packages/opencode/dist/opencode-linux*

  release:
    needs: build-cli
    runs-on: ubuntu-latest
    if: inputs.version
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.11"

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          files: |
            packages/opencode/dist/opencode-linux-x64.tar.gz
            packages/opencode/dist/opencode-linux-arm64.tar.gz
            packages/opencode/dist/opencode-linux-x64-baseline.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}